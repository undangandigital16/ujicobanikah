<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Demo Alur Buka Undangan + Video Intro</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:wght@400;500&display=swap" rel="stylesheet">
<style>
  html,body{
    margin:0;
    font-family:'Cormorant Garamond', serif;
    background:#f6efe2;
    /* PENTING: scroll dikunci dulu sebelum undangan dibuka */
    overflow: hidden;
    height:100%;
  }
  body.unlocked{ overflow: auto; height:auto; }

  /* ================= 1. COVER (sebelum diklik) ================= */
  #cover{
    position:fixed; inset:0;
    background: linear-gradient(180deg,#e9e2cf,#d9cfae);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    z-index: 30;
    transition: opacity 0.6s ease;
  }
  #cover h1{ font-family:'Great Vibes',cursive; font-size:2.6rem; color:#5a4a2f; margin-bottom:6px;}
  #cover p{ letter-spacing:3px; text-transform:uppercase; font-size:0.75rem; color:#8a7550; margin-bottom:28px;}
  #btnBuka{
    padding: 14px 34px;
    border:1px solid #8a6d3b;
    background:transparent;
    color:#5a4a2f;
    font-family:'Cormorant Garamond', serif;
    font-size:1rem;
    letter-spacing:2px;
    cursor:pointer;
    border-radius: 30px;
    transition: background 0.3s;
  }
  #btnBuka:hover{ background:#8a6d3b; color:#fff; }
  #cover.hide{ opacity:0; pointer-events:none; }

  /* ================= 2. VIDEO / ANIMASI INTRO ================= */
  #introVideo{
    position:fixed; inset:0;
    z-index: 20;
    display:none;
    background:#1a1611;
    align-items:center; justify-content:center;
    overflow:hidden;
  }
  #introVideo.show{ display:flex; }

  /* pengganti sementara <video> asli -- ganti dengan tag <video> di produksi */
  #fakeVideoStage{
    position:relative;
    width:100%; height:100%;
    display:flex; align-items:center; justify-content:center;
  }
  .fv-petal{
    position:absolute; top:-30px;
    width:16px;height:16px;
    background:#e7a9a0; border-radius:0 60% 0 60%;
    animation: fvFall linear forwards;
  }
  @keyframes fvFall{ to{ transform: translateY(110vh) rotate(360deg); } }
  #fvText{
    position:relative; z-index:2;
    color:#f3e9d2; text-align:center;
    font-family:'Great Vibes',cursive;
    font-size: 2.4rem;
    opacity:0;
    animation: fvTextIn 1.2s ease forwards;
    animation-delay: 1.6s;
  }
  @keyframes fvTextIn{ to{ opacity:1; transform:translateY(-6px);} }

  #skipBtn{
    position:absolute; bottom:24px; right:24px;
    z-index:5;
    background:transparent; border:1px solid rgba(255,255,255,0.5);
    color:#f3e9d2; padding:8px 16px; border-radius:20px;
    font-family:'Cormorant Garamond',serif; cursor:pointer;
  }

  /* ================= 3. HALAMAN UTAMA (setelah video selesai) ================= */
  #mainPage{
    position:relative;
    z-index:1;
    min-height: 300vh; /* biar ada yang bisa di-scroll, simulasi konten panjang */
    opacity:0;
    transition: opacity 1s ease;
  }
  #mainPage.reveal{ opacity:1; }

  .hero{
    height:100vh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center;
  }
  .hero p{ letter-spacing:3px; text-transform:uppercase; font-size:0.75rem; color:#8a7550;}
  .hero h1{ font-family:'Great Vibes',cursive; font-size:3rem; color:#5a4a2f; margin:6px 0;}
  .scroll-hint{
    position:absolute; bottom:30px; font-size:0.75rem; color:#8a7550;
    animation: bounce 1.6s infinite;
  }
  @keyframes bounce{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(8px);} }

  .section{
    height:100vh;
    display:flex; align-items:center; justify-content:center;
    border-top: 1px solid #ddd0af;
    color:#5a4a2f;
    font-size:1.3rem;
  }
</style>
</head>
<body>

  <!-- 1. COVER -->
  <div id="cover">
    <p>The Wedding Of</p>
    <h1>Yunita &amp; Riyan</h1>
    <button id="btnBuka">Buka Undangan</button>
  </div>

  <!-- 2. VIDEO / ANIMASI INTRO -->
  <div id="introVideo">
    <div id="fakeVideoStage">
      <div id="fvText">Yunita &amp; Riyan</div>
    </div>
    <button id="skipBtn">Lewati</button>
  </div>

  <!-- 3. HALAMAN UTAMA -->
  <div id="mainPage">
    <div class="hero">
      <p>The Wedding Of</p>
      <h1>Yunita &amp; Riyan</h1>
      <div class="scroll-hint">▼ scroll ke bawah</div>
    </div>
    <div class="section">Detail Acara</div>
    <div class="section">Galeri</div>
    <div class="section">RSVP</div>
  </div>

<script>
const cover = document.getElementById('cover');
const introVideo = document.getElementById('introVideo');
const fakeStage = document.getElementById('fakeVideoStage');
const mainPage = document.getElementById('mainPage');
const btnBuka = document.getElementById('btnBuka');
const skipBtn = document.getElementById('skipBtn');

function spawnPetals(n){
  const colors = ['#e7a9a0','#f2c9c0','#d98d7f'];
  for(let i=0;i<n;i++){
    const p = document.createElement('div');
    p.className = 'fv-petal';
    p.style.left = Math.random()*100 + '%';
    p.style.background = colors[Math.floor(Math.random()*colors.length)];
    p.style.animationDuration = (2.5 + Math.random()*2) + 's';
    p.style.animationDelay = (Math.random()*1.5) + 's';
    fakeStage.appendChild(p);
  }
}

function finishIntro(){
  introVideo.classList.remove('show');
  document.body.classList.add('unlocked');   // <-- kunci scroll dibuka di sini
  mainPage.classList.add('reveal');
  window.scrollTo(0,0);
}

btnBuka.addEventListener('click', () => {
  cover.classList.add('hide');

  // ======= DI SINI tempat kamu ganti dengan <video> asli =======
  //Contoh produksi:
  const video = document.createElement('video');
  video.src = 'intro.mp4';
  video.autoplay = true; video.playsInline = true;
  video.addEventListener('ended', finishIntro);
  introVideo.appendChild(video);
  spawnPetals(20);
  introVideo.classList.add('show');

  // simulasi "durasi video" = 3.5 detik lalu otomatis lanjut
  setTimeout(finishIntro, 3500);
});

skipBtn.addEventListener('click', finishIntro);
</script>

</body>
</html>
