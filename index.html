<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>The Wedding of Apriandi & Dahlia</title>

  <meta property="og:type" content="website">
  <meta property="og:title" content="The Wedding of Apriandi & Dahlia">
  <meta property="og:description" content="Dengan memohon rahmat dan ridho Allah SWT, kami mengundang Anda untuk hadir di acara pernikahan kami.">
  <meta property="og:image" content="page1.jpg">
  <meta name="theme-color" content="#0c0a08">

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Great+Vibes&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0c0a08;
      --gold: #d4af37;
      --text: #f3f0ea;
      --muted: #9a9286;
      --page: #f7f1e6;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      font-family: 'Outfit', sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* COVER */
    #cover {
      position: fixed; inset: 0; z-index: 1000;
      background: radial-gradient(ellipse at center, #1b1610 0%, #0a0908 70%);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      transition: opacity 0.85s ease, visibility 0.85s;
      perspective: 1600px;
    }
    #cover.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

    .hard-book {
      width: min(72vw, 290px);
      height: min(100vw, 400px);
      position: relative;
      transform-style: preserve-3d;
      cursor: pointer;
      transition: transform 0.35s ease;
    }
    .hard-book:hover { transform: translateY(-4px); }

    .hard-cover {
      position: absolute; inset: 0;
      border-radius: 3px 14px 14px 3px;
      overflow: hidden;
      transform-origin: left center;
      transition: transform 1.4s cubic-bezier(0.22, 0.61, 0.36, 1);
      z-index: 5;
      box-shadow: 16px 18px 40px rgba(0,0,0,0.65);
      border: 1px solid #4a3f30;
    }
    .hard-cover img {
      width: 100%; height: 100%; object-fit: cover; display: block;
    }
    .hard-book.open .hard-cover { transform: rotateY(-155deg); }

    .spine {
      position: absolute; left: 0; top: 0; bottom: 0; width: 12px;
      background: linear-gradient(to right, #0a0806, #3a3024, #0a0806);
      border-radius: 3px 0 0 3px; z-index: 6; pointer-events: none;
    }

    .hint {
      margin-top: 28px; font-size: 0.8rem; color: var(--muted);
      letter-spacing: 1px; animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:.4} 50%{opacity:1} }

    .guest-box { margin-top: 12px; text-align: center; font-size: 0.9rem; }
    .guest-box strong {
      display: block; margin-top: 4px;
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.28rem; color: var(--gold); font-weight: 600;
    }

    /* STAGE */
    #stage {
      position: fixed; inset: 0; z-index: 100;
      display: none; align-items: center; justify-content: center;
      background: radial-gradient(ellipse at center, #18140f 0%, #0a0908 75%);
      perspective: 2200px;
      padding: 12px 12px 100px;
    }
    #stage.show { display: flex; }

    .book {
      width: min(86vw, 340px);
      height: min(118vw, 500px);
      position: relative;
      transform-style: preserve-3d;
      transform: rotateX(5deg);
    }

    .sheet {
      position: absolute; inset: 0;
      transform-origin: left center;
      transform-style: preserve-3d;
      transition: transform 1.35s cubic-bezier(0.23, 0.8, 0.32, 1);
      will-change: transform;
      border-radius: 2px 10px 10px 2px;
    }

    .sheet-face {
      position: absolute; inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 2px 10px 10px 2px;
      overflow: hidden;
      background: var(--page);
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    }

    .sheet-face.front {
      z-index: 2;
      background: #f7f1e6;
      border: 1px solid #ddd2bf;
    }
    .sheet-face.back {
      transform: rotateY(180deg);
      background: #efe6d6;
      border: 1px solid #ddd2bf;
    }

    .sheet-face.front img {
      width: 100%; height: 100%; object-fit: cover; display: block;
    }

    .sheet-face.front::before {
      content: '';
      position: absolute; left: 0; top: 0; bottom: 0; width: 14px;
      background: linear-gradient(to right, rgba(0,0,0,0.1), transparent);
      z-index: 3; pointer-events: none;
    }

    .sheet.turning .sheet-face.front::after {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(to right,
        rgba(0,0,0,0.18) 0%,
        rgba(0,0,0,0.05) 22%,
        transparent 48%,
        rgba(255,255,255,0.07) 80%,
        rgba(0,0,0,0.08) 100%);
      z-index: 4; pointer-events: none;
    }

    .sheet.flipped { transform: rotateY(-180deg); }

    .controls {
      position: fixed; bottom: 18px; left: 0; right: 0;
      display: none; justify-content: center; align-items: center;
      gap: 16px; z-index: 200;
    }
    .controls.show { display: flex; }

    .nav-btn {
      width: 46px; height: 46px; border-radius: 50%;
      border: 1px solid #3a3228; background: #1a1610;
      color: var(--gold); font-size: 1.15rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .nav-btn:disabled { opacity: 0.3; pointer-events: none; }

    .indicator {
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.95rem; color: var(--muted); min-width: 64px; text-align: center;
    }
    .indicator span { color: var(--gold); }

    .music-btn {
      position: fixed; top: 14px; right: 14px;
      width: 40px; height: 40px; border-radius: 50%;
      background: #1a1610; border: 1px solid #3a3228;
      color: var(--gold); font-size: 1rem; z-index: 300;
      cursor: pointer; display: none; align-items: center; justify-content: center;
    }
    .music-btn.show { display: flex; }

    .tap-zone { position: absolute; top: 0; bottom: 0; width: 40%; z-index: 20; }
    .tap-left { left: 0; }
    .tap-right { right: 0; }
  </style>
</head>
<body>

  <!-- COVER -->
  <div id="cover">
    <div class="hard-book" id="hardBook" onclick="openBook()">
      <div class="hard-cover">
        <div class="spine"></div>
        <img src="page1.jpg" alt="Cover Apriandi & Dahlia">
      </div>
    </div>
    <div class="hint" id="hint">Ketuk buku untuk membuka</div>
    <div class="guest-box">
      Kepada
      <strong id="guestName">Bapak/Ibu/Saudara/i</strong>
    </div>
  </div>

  <!-- BOOK -->
  <div id="stage">
    <div class="book" id="book">

      <!-- Page 6 - Terima Kasih -->
      <div class="sheet" data-sheet="6" style="z-index:1">
        <div class="sheet-face front"><img src="page6.jpg" alt="Halaman 6"></div>
        <div class="sheet-face back"></div>
      </div>

      <!-- Page 5 - Quote -->
      <div class="sheet" data-sheet="5" style="z-index:2">
        <div class="sheet-face front"><img src="page5.jpg" alt="Halaman 5"></div>
        <div class="sheet-face back"></div>
      </div>

      <!-- Page 4 - Detail Undangan -->
      <div class="sheet" data-sheet="4" style="z-index:3">
        <div class="sheet-face front"><img src="page4.jpg" alt="Halaman 4"></div>
        <div class="sheet-face back"></div>
      </div>

      <!-- Page 3 - Mempelai Wanita -->
      <div class="sheet" data-sheet="3" style="z-index:4">
        <div class="sheet-face front"><img src="page3.jpg" alt="Halaman 3"></div>
        <div class="sheet-face back"></div>
      </div>

      <!-- Page 2 - Mempelai Pria -->
      <div class="sheet" data-sheet="2" style="z-index:5">
        <div class="sheet-face front"><img src="page2.jpg" alt="Halaman 2"></div>
        <div class="sheet-face back"></div>
      </div>

      <!-- Page 1 - Cover couple (inside first page) -->
      <div class="sheet" data-sheet="1" style="z-index:6">
        <div class="sheet-face front"><img src="page1.jpg" alt="Halaman 1"></div>
        <div class="sheet-face back"></div>
      </div>

      <div class="tap-zone tap-left" onclick="prevPage()"></div>
      <div class="tap-zone tap-right" onclick="nextPage()"></div>
    </div>
  </div>

  <div class="controls" id="controls">
    <button class="nav-btn" id="prevBtn" onclick="prevPage()" disabled>‹</button>
    <div class="indicator"><span id="cur">1</span> / <span id="total">6</span></div>
    <button class="nav-btn" id="nextBtn" onclick="nextPage()">›</button>
  </div>

  <button class="music-btn" id="musicBtn" onclick="toggleMusic()">♪</button>

  <audio id="bgMusic" loop>
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
  </audio>

  <script>
    const params = new URLSearchParams(location.search);
    document.getElementById('guestName').textContent = params.get('kpd') || 'Bapak/Ibu/Saudara/i';

    const TOTAL = 6;
    let current = 1;
    let busy = false;
    let opened = false;

    function openBook() {
      if (opened) return;
      opened = true;
      document.getElementById('hardBook').classList.add('open');
      document.getElementById('hint').style.opacity = '0';
      setTimeout(() => {
        document.getElementById('cover').classList.add('hidden');
        document.getElementById('stage').classList.add('show');
        document.getElementById('controls').classList.add('show');
        document.getElementById('musicBtn').classList.add('show');
        document.getElementById('bgMusic').play().catch(()=>{});
        updateUI();
      }, 1300);
    }

    function sheet(n) { return document.querySelector('.sheet[data-sheet="' + n + '"]'); }

    function nextPage() {
      if (current >= TOTAL || busy) return;
      busy = true;
      const s = sheet(current);
      s.classList.add('turning');
      requestAnimationFrame(() => {
        s.classList.add('flipped');
        s.style.zIndex = String(current);
      });
      current++;
      updateUI();
      setTimeout(() => { s.classList.remove('turning'); busy = false; }, 1400);
    }

    function prevPage() {
      if (current <= 1 || busy) return;
      busy = true;
      current--;
      const s = sheet(current);
      s.classList.add('turning');
      s.style.zIndex = String(TOTAL + 2 - current);
      requestAnimationFrame(() => { s.classList.remove('flipped'); });
      updateUI();
      setTimeout(() => { s.classList.remove('turning'); busy = false; }, 1400);
    }

    function updateUI() {
      document.getElementById('cur').textContent = current;
      document.getElementById('total').textContent = TOTAL;
      document.getElementById('prevBtn').disabled = current <= 1;
      document.getElementById('nextBtn').disabled = current >= TOTAL;
    }

    let x0 = 0;
    document.getElementById('stage').addEventListener('touchstart', e => { x0 = e.changedTouches[0].screenX; }, {passive:true});
    document.getElementById('stage').addEventListener('touchend', e => {
      const dx = e.changedTouches[0].screenX - x0;
      if (dx < -48) nextPage();
      if (dx > 48) prevPage();
    }, {passive:true});

    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight') nextPage();
      if (e.key === 'ArrowLeft') prevPage();
    });

    let playing = true;
    function toggleMusic() {
      const m = document.getElementById('bgMusic');
      const b = document.getElementById('musicBtn');
      if (playing) { m.pause(); b.textContent = '♪'; }
      else { m.play(); b.textContent = '♫'; }
      playing = !playing;
    }
  </script>
</body>
</html>
