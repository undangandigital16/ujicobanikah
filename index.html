<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Demo Alur Buka Undangan + Video Intro</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:wght@400;500&display=swap" rel="stylesheet">
<style>
  html,body{
    margin:0;
    font-family:'Cormorant Garamond', serif;
    background:#f6efe2;
    /* PENTING: scroll dikunci dulu sebelum undangan dibuka */
    overflow: hidden;
    height:100%;
  }
  body.unlocked{ overflow: auto; height:auto; }

  /* ================= 1. COVER (sebelum diklik) ================= */
  #cover{
    position:fixed; inset:0;
    background: linear-gradient(180deg,#e9e2cf,#d9cfae);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    z-index: 30;
    transition: opacity 0.6s ease;
  }
  #cover h1{ font-family:'Great Vibes',cursive; font-size:2.6rem; color:#5a4a2f; margin-bottom:6px;}
  #cover p{ letter-spacing:3px; text-transform:uppercase; font-size:0.75rem; color:#8a7550; margin-bottom:28px;}
  #btnBuka{
    padding: 14px 34px;
    border:1px solid #8a6d3b;
    background:transparent;
    color:#5a4a2f;
    font-family:'Cormorant Garamond', serif;
    font-size:1rem;
    letter-spacing:2px;
    cursor:pointer;
    border-radius: 30px;
    transition: background 0.3s;
  }
  #btnBuka:hover{ background:#8a6d3b; color:#fff; }
  #cover.hide{ opacity:0; pointer-events:none; }

  /* ================= 2. VIDEO / ANIMASI INTRO ================= */
  #introVideo{
    position:fixed; inset:0;
    z-index: 20;
    display:none;
    background:#1a1611;
    align-items:center; justify-content:center;
    overflow:hidden;
  }
  #introVideo.show{ display:flex; }

  #introVideoEl{
    width:100%; height:100%;
    object-fit: cover; /* video mengisi penuh layar tanpa gepeng */
  }

  /* tampil kalau video gagal dimuat (file belum ada / rusak) */
  #videoError{
    position:absolute; inset:0;
    display:none;
    align-items:center; justify-content:center;
    color:#f3e9d2; text-align:center;
    font-size:1rem; padding:20px;
  }
  #videoError.show{ display:flex; }

  #skipBtn{
    position:absolute; bottom:24px; right:24px;
    z-index:5;
    background:transparent; border:1px solid rgba(255,255,255,0.5);
    color:#f3e9d2; padding:8px 16px; border-radius:20px;
    font-family:'Cormorant Garamond',serif; cursor:pointer;
  }

  /* ================= 3. HALAMAN UTAMA (setelah video selesai) ================= */
  #mainPage{
    position:relative;
    z-index:1;
    min-height: 300vh; /* biar ada yang bisa di-scroll, simulasi konten panjang */
    opacity:0;
    transition: opacity 1s ease;
  }
  #mainPage.reveal{ opacity:1; }

  .hero{
    height:100vh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center;
  }
  .hero p{ letter-spacing:3px; text-transform:uppercase; font-size:0.75rem; color:#8a7550;}
  .hero h1{ font-family:'Great Vibes',cursive; font-size:3rem; color:#5a4a2f; margin:6px 0;}
  .scroll-hint{
    position:absolute; bottom:30px; font-size:0.75rem; color:#8a7550;
    animation: bounce 1.6s infinite;
  }
  @keyframes bounce{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(8px);} }

  .section{
    height:100vh;
    display:flex; align-items:center; justify-content:center;
    border-top: 1px solid #ddd0af;
    color:#5a4a2f;
    font-size:1.3rem;
  }
</style>
</head>
<body>

  <!-- 1. COVER -->
  <div id="cover">
    <p>The Wedding Of</p>
    <h1>Yunita &amp; Riyan</h1>
    <button id="btnBuka">Buka Undangan</button>
  </div>

  <!-- 2. VIDEO INTRO ASLI -->
  <div id="introVideo">
    <video id="introVideoEl" src="intro.mp4" playsinline webkit-playsinline></video>
    <div id="videoError">
      Video tidak ditemukan / gagal dimuat.<br>
      Pastikan file <b>intro.mp4</b> ada satu folder dengan HTML ini.
    </div>
    <button id="skipBtn">Lewati</button>
  </div>

  <!-- 3. HALAMAN UTAMA -->
  <div id="mainPage">
    <div class="hero">
      <p>The Wedding Of</p>
      <h1>Yunita &amp; Riyan</h1>
      <div class="scroll-hint">▼ scroll ke bawah</div>
    </div>
    <div class="section">Detail Acara</div>
    <div class="section">Galeri</div>
    <div class="section">RSVP</div>
  </div>

<script>
const cover = document.getElementById('cover');
const introVideo = document.getElementById('introVideo');
const video = document.getElementById('introVideoEl');
const videoError = document.getElementById('videoError');
const mainPage = document.getElementById('mainPage');
const btnBuka = document.getElementById('btnBuka');
const skipBtn = document.getElementById('skipBtn');

let finished = false; // jaga-jaga supaya finishIntro tidak double-jalan

function finishIntro(){
  if (finished) return;
  finished = true;
  introVideo.classList.remove('show');
  video.pause();
  document.body.classList.add('unlocked');   // <-- kunci scroll dibuka di sini
  mainPage.classList.add('reveal');
  window.scrollTo(0,0);
}

btnBuka.addEventListener('click', () => {
  cover.classList.add('hide');
  introVideo.classList.add('show');

  // klik tombol ini terhitung "user gesture", jadi autoplay + suara diizinkan browser
  video.muted = false;
  const playPromise = video.play();

  if (playPromise !== undefined) {
    playPromise.catch(() => {
      // kalau browser tetap menolak play dengan suara, coba lagi tanpa suara
      video.muted = true;
      video.play().catch(() => {
        // video benar-benar gagal diputar (misal file belum diupload)
        videoError.classList.add('show');
      });
    });
  }
});

// video otomatis pindah ke halaman utama saat selesai diputar
video.addEventListener('ended', finishIntro);

// kalau file video tidak ketemu / error saat load
video.addEventListener('error', () => {
  videoError.classList.add('show');
});

// tombol "Lewati" tetap tersedia kalau tamu tidak mau nunggu videonya
skipBtn.addEventListener('click', finishIntro);
</script>

</body>
</html>
